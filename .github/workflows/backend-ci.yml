# Gate for the backend: packages/server, packages/engines, the shared package's own checks, the
# Docker stack and the container image (ImBackendImplementationPlan P1-10).
#
# Jobs, cheapest first:
#   static       typecheck, lint, unit tests, version pins, secret scan
#   integration  the same tests against the real compose stack (Postgres, Valkey, S3, SQS, SMTP)
#   image        build web, worker and migrate; Trivy fails on fixable critical/high findings; SBOM
#   deps         dependency vulnerability report (OSV), report-only until the baseline is triaged
#
# Third-party actions are pinned to full commit SHAs (a tag can be re-pointed); first-party
# GitHub actions follow the repo's existing major-version style.
name: backend-ci

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/web/app/api/**"
      - "apps/web/next.config.ts"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/**"
      - "aws/migrations/**"
      - ".env.example"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/web/app/api/**"
      - "apps/web/next.config.ts"
      - "docker/**"
      - "docker-compose.yml"
      - "scripts/**"
      - "aws/migrations/**"
      - ".env.example"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit, pins, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the commits in the push or PR

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm --filter @nextkin/server --filter @nextkin/engines --filter @nextkin/shared typecheck

      - name: lint (includes the phone-safety and purity fences)
        run: pnpm --filter @nextkin/server --filter @nextkin/engines --filter @nextkin/shared lint

      - name: unit tests
        run: pnpm --filter @nextkin/server --filter @nextkin/engines --filter @nextkin/shared test

      - name: Image pins (no latest tags)
        run: pnpm check:pins

      - name: OpenAPI document is up to date
        run: pnpm --filter @nextkin/server openapi:check

      # A breaking change to /api/v1 needs /api/v2 (P3-07): mobile store builds lag behind.
      - name: OpenAPI breaking-change gate (oasdiff)
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          if ! git cat-file -e "$base:packages/server/openapi.json" 2>/dev/null; then echo "No base document yet."; exit 0; fi
          git show "$base:packages/server/openapi.json" > /tmp/openapi-base.json
          eval "$(grep -E '^OASDIFF_' docker/versions.env)"
          curl -sSfL -o /tmp/oasdiff.tar.gz "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_LINUX_AMD64_SHA256}  /tmp/oasdiff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          /tmp/oasdiff breaking /tmp/openapi-base.json packages/server/openapi.json --fail-on ERR

      # Lints the migrations this change adds or edits (.squawk.toml). The baseline 0001–0006 is
      # excluded there; every later file is held to the live-table rules.
      - name: Migration lint (squawk)
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'aws/migrations/*.sql' | grep -vE '/000[1-6]_' || true)
          if [ -z "$files" ]; then echo "No new or changed migrations to lint."; exit 0; fi
          eval "$(grep -E '^SQUAWK_' docker/versions.env)"
          curl -sSfL -o squawk "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_LINUX_X64_SHA256}  squawk" | sha256sum -c -
          chmod +x squawk
          ./squawk $files

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same stack and the same addresses as a laptop (L1): .env.example holds only local values.
      - name: Start the core stack
        run: |
          cp .env.example .env
          pnpm stack:up

      - name: Create buckets, confirm queues
        run: pnpm stack:init

      - name: Migrate (applies aws/migrations as the owner role)
        run: pnpm migrate

      - name: Query types match the migrated schema
        run: pnpm --filter @nextkin/server db:types:check

      # Seeding twice proves it is idempotent and that RLS lets each persona write its own data.
      - name: Seed (twice)
        run: pnpm seed && pnpm seed

      # Includes the RLS adversarial suite and the EXPLAIN gate on synthetic volume.
      - name: Integration tests
        run: pnpm test:integration

      - name: Stack logs on failure
        if: failure()
        run: pnpm stack:ps && docker compose --env-file docker/versions.env --profile core logs --no-color --tail 200

  image:
    name: Image (web, worker, migrate) + scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned versions
        id: v
        run: |
          grep -E '^(NODE_IMAGE|LIB_PLAYWRIGHT)=' docker/versions.env >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # amd64 here; the release pipeline (X-06) builds amd64 + arm64 for Fargate.
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: nextkin-${{ matrix.target }}:ci
          build-args: |
            NODE_IMAGE=${{ steps.v.outputs.NODE_IMAGE }}
            PLAYWRIGHT_VERSION=${{ steps.v.outputs.LIB_PLAYWRIGHT }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Chromium renders inside the worker image
        if: matrix.target == 'worker'
        run: docker run --rm nextkin-worker:ci node dist/render-check.mjs

      - name: Trivy (fail on fixable critical/high)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextkin-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: nextkin-${{ matrix.target }}:ci
          artifact-name: sbom-${{ matrix.target }}.spdx.json
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker, migrate]

  deps:
    name: Dependency vulnerabilities (report)
    needs: static
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      # Report-only until the existing baseline (apps included) is triaged; then flip to true.
      fail-on-vuln: false
      upload-sarif: false
