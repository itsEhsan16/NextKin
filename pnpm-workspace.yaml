packages:
  - apps/*
  - packages/*

# React Native's toolchain resolves a lot of packages it never declares — @babel/runtime is
# injected into app sources by transform-runtime, @react-native/assets-registry into every asset
# module — so the tree has to be flat. pnpm 11 no longer reads non-auth settings from .npmrc, which
# is why the `node-linker=hoisted` that used to live there had silently stopped applying: the
# install was isolated, and an EAS release build failed on the first of those undeclared packages.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: false
  # esbuild powers tsx and Vitest; its install script verifies the platform binary.
  esbuild: true
  # Its only script prints a funding banner (opencollective-postinstall); nothing to build.
  tesseract.js: false

# Security floors from `pnpm scan:deps` (P13-01): a transitive dependency held below its fixed
# release. Remove an entry once the package that pulls it in requires the fixed version itself.
overrides:
  # next's optional image dependency; GHSA-wq5f-xc86-pv6w (librsvg) is fixed in 0.35.5.
  sharp@<0.35.5: 0.35.5
