# SQS stand-in for local development and CI (ImBackendImplementationPlan P1-04, spec §9.3).
# Same queue names and shape as the cloud: two FIFO generation queues drained priority-first, one
# FIFO maintenance queue, each with a DLQ. maxReceiveCount mirrors the planned SQS redrive policy.
#
# Message persistence is OFF: ElasticMQ keeps messages in memory, so a restart loses in-flight
# messages, unlike SQS. The transactional outbox (P6-02) republishes anything unacknowledged, and
# P13-02's restart drill proves it. [verify whether elasticmq-native supports H2 message storage]

include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Enforce real SQS limits (message size, batch sizes) so local code cannot rely on looser ones.
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  "generation-priority.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "generation-priority-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "generation-priority-dlq.fifo" {
    fifo = true
  }

  "generation-standard.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "generation-standard-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "generation-standard-dlq.fifo" {
    fifo = true
  }

  "maintenance.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "maintenance-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "maintenance-dlq.fifo" {
    fifo = true
  }
}
