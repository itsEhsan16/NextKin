<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tectonic in the latex image: no system font directories, so only the TeX bundle
     fonts (loaded by file name) are ever used. The cache goes to /tmp (read-only root). -->
<fontconfig>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
